[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "axiomrunner"
version = "0.1.0"
description = "Local-first evidence-backed Python challenge solver"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "MutugiD" }]
dependencies = []

[project.scripts]
axiomrunner = "axiomrunner.cli:main"

[dependency-groups]
dev = [
  "build>=1.3",
  "mypy>=1.18",
  "pip-audit>=2.9",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/axiomrunner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=axiomrunner --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = ["docker: requires a healthy local Docker engine"]
